<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - HarvestHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Reset Password</h1>
      <p>Enter your registered email or mobile number and set a new password.</p>
      <form id="forgotPasswordForm" class="auth-form">
        <input name="identifier" type="text" placeholder="Email or Mobile Number" required>
        <input name="password" type="password" placeholder="New Password: 8+ chars, Aa1@" minlength="8" required>
        <input name="confirmPassword" type="password" placeholder="Confirm New Password" minlength="8" required>
        <button class="btn primary" type="submit">Update Password</button>
      </form>
      <div class="auth-links">
        <a class="auth-link" href="customer-login.html">Back to customer login</a>
        <a class="auth-link" href="index.html">Back to portal</a>
      </div>
    </section>
    <aside class="auth-visual">
      <h2>HarvestHub</h2>
      <p>Secure access to your customer account.</p>
    </aside>
  </main>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
