<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - HarvestHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Customer Registration</h1>
      <p>Create your HarvestHub account to start ordering farm-fresh products.</p>
      <form id="customerRegisterForm" class="auth-form">
        <input name="fullName" type="text" placeholder="Username / Full Name" minlength="3" required>
        <input name="mobile" type="tel" placeholder="Mobile Number (10 digits)" pattern="[0-9]{10}" minlength="10" maxlength="10" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password: 8+ chars, Aa1@" minlength="8" required>
        <input name="confirmPassword" type="password" placeholder="Confirm Password" minlength="8" required>
        <button class="btn primary" type="submit">Register</button>
      </form>
      <div class="auth-links">
        <a class="auth-link" href="customer-login.html">Already have an account? Login</a>
        <a class="auth-link" href="index.html">Back to portal</a>
      </div>
    </section>
    <aside class="auth-visual">
      <h2>HarvestHub</h2>
      <p>Fresh dairy, vegetables, fruits, grains, and eggs from trusted farms.</p>
    </aside>
  </main>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
