<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - HarvestHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Customer Login</h1>
      <p>Shop from trusted village farms with fast doorstep delivery.</p>
      <form id="customerLoginForm" class="auth-form">
        <input name="email" type="text" placeholder="Email or Mobile Number" required>
        <input name="password" type="password" placeholder="Password" required>
        <button class="btn primary" type="submit">Login</button>
      </form>
      <div class="auth-links">
        <a class="auth-link" href="customer-register.html">New customer? Register here</a>
        <a class="auth-link" href="forgot-password.html">Forgot password?</a>
        <a class="auth-link" href="index.html">Back to portal</a>
      </div>
    </section>
    <aside class="auth-visual">
      <h2>HarvestHub</h2>
      <p>Daily essentials from dairy farms, orchards, and village fields.</p>
    </aside>
  </main>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
